; CouchDB local configuration for Self-hosted LiveSync
; Vendored from vrtmrz/obsidian-livesync (MIT). See ../../../THIRD_PARTY_NOTICES.md.
;
; IMPORTANT: Do NOT set require_valid_user here. CouchDB needs to start
; without auth to finish its first-run cluster setup. The couchdb-init
; service applies auth lockdown via the REST API after first boot.

[couchdb]
; Max size per document (50MB) — large enough for binary attachments.
max_document_size = 50000000

[chttpd]
bind_address = 0.0.0.0
port = 5984
; 4 GB max request — handles very large vaults.
max_http_request_size = 4294967296

[httpd]
WWW-Authenticate = Basic realm="couchdb"

[cors]
; Exact app origins Obsidian uses on desktop + mobile.
credentials = true
origins = app://obsidian.md,capacitor://localhost,http://localhost

[log]
level = warning
