# Shared CouchDB for the Self-hosted LiveSync plugin. One server, one database
# per vault: each vault that uses self-hosted LiveSync gets its own database
# here and its own worker (sync/livesync) that mirrors it into real files.
# install.sh starts this once, the first time a vault needs it.
#
# couchdb/couchdb-init/caddy/tailscale/cloudflared are vendored from
# https://github.com/vrtmrz/obsidian-livesync (MIT, docker/ folder), paths
# adjusted to fit this repo. See ../../THIRD_PARTY_NOTICES.md.
#
# PROFILES
#   (default)              CouchDB — LAN/localhost, no TLS
#   --profile caddy        + Caddy reverse proxy, auto TLS via Let's Encrypt
#   --profile tailscale    + Tailscale sidecar, HTTPS via *.ts.net
#   --profile cloudflare   + cloudflared tunnel

name: ${INSTANCE_PREFIX:-}obsidian-couchdb

services:
  couchdb:
    image: couchdb:latest
    container_name: ${INSTANCE_PREFIX:-}obsidian-couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?Set COUCHDB_USER in .env}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
    volumes:
      - couchdb-data:/opt/couchdb/data
      # Mount to /opt/couchdb/etc/local.ini (NOT local.d/). Do NOT add :ro —
      # the CouchDB entrypoint chmods this file at startup and crashes on a
      # read-only mount. It's only read at startup; runtime changes go via
      # the REST API (see couchdb-init.sh) into local.d/docker.ini.
      - ./config/livesync.ini:/opt/couchdb/etc/local.ini
    ports:
      - "${COUCHDB_PORT:-5984}:5984"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -sf -u ${COUCHDB_USER}:${COUCHDB_PASSWORD} http://localhost:5984/_session | grep -q ok || exit 1"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks:
      - livesync

  # One-shot: runs after CouchDB is healthy, sets single-node cluster, auth,
  # CORS and size limits. Per-vault databases are created by install.sh.
  couchdb-init:
    image: curlimages/curl:latest
    container_name: ${INSTANCE_PREFIX:-}obsidian-couchdb-init
    restart: on-failure
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      COUCHDB_INTERNAL_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    volumes:
      - ./scripts/couchdb-init.sh:/couchdb-init.sh:ro
    entrypoint: ["sh", "/couchdb-init.sh"]
    networks:
      - livesync

  # --profile caddy — public domain + automatic Let's Encrypt TLS
  caddy:
    image: caddy:latest
    container_name: ${INSTANCE_PREFIX:-}obsidian-couchdb-caddy
    profiles: [caddy]
    restart: unless-stopped
    depends_on:
      couchdb:
        condition: service_healthy
    environment:
      COUCHDB_DOMAIN: ${COUCHDB_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - livesync

  # --profile tailscale — no domain needed, HTTPS via *.ts.net
  tailscale:
    image: tailscale/tailscale:latest
    container_name: ${INSTANCE_PREFIX:-}obsidian-couchdb-tailscale
    profiles: [tailscale]
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:-livesync}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./config/ts-serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    network_mode: service:couchdb
    depends_on:
      - couchdb

  # --profile cloudflare — Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ${INSTANCE_PREFIX:-}obsidian-couchdb-cloudflared
    profiles: [cloudflare]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    depends_on:
      couchdb:
        condition: service_healthy
    networks:
      - livesync

volumes:
  couchdb-data:
  caddy-data:
  caddy-config:
  tailscale-state:

# Shared with every vault's LiveSync worker (separate compose projects), so
# it's created by install.sh rather than owned by this project.
networks:
  livesync:
    name: ${INSTANCE_PREFIX:-}obsidian-livesync
    external: true
