name: ${INSTANCE_PREFIX:-}obsidian-server-stack

services:
  # REST API over the vaults' markdown files. Only reachable inside this
  # compose network — obsidian-mcp is its only client. Each request names a
  # vault; the list of vaults is vaults/.registry.json, managed by install.sh.
  obsidian-api:
    build:
      context: ./services/obsidian-api
    image: ${INSTANCE_PREFIX:-}obsidian-api:local
    container_name: ${INSTANCE_PREFIX:-}obsidian-api
    restart: unless-stopped
    environment:
      PORT: 3000
      VAULTS_ROOT: /vaults
      API_KEY: ${API_KEY:?Set API_KEY in .env}
    volumes:
      - ./vaults:/vaults
    networks:
      - obsidian-net

  # The MCP server. MCP clients authenticate to it with MCP_BEARER_TOKEN; it
  # authenticates to obsidian-api with API_KEY.
  obsidian-mcp:
    build:
      context: ./services/obsidian-mcp
    image: ${INSTANCE_PREFIX:-}obsidian-mcp:local
    container_name: ${INSTANCE_PREFIX:-}obsidian-mcp
    restart: unless-stopped
    # Passes through optional settings like MCP_OAUTH_* if set in .env.
    env_file:
      - .env
    environment:
      PORT: 7002
      OBSIDIAN_BASE_URL: http://obsidian-api:3000
      OBSIDIAN_API_KEY: ${API_KEY:?Set API_KEY in .env}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?Set MCP_BEARER_TOKEN in .env}
      OBSIDIAN_DAILY_FOLDER: ${OBSIDIAN_DAILY_FOLDER:-Journal}
      OBSIDIAN_TIMEZONE: ${OBSIDIAN_TIMEZONE:-UTC}
      OBSIDIAN_MAX_ATTACHMENT_BYTES: ${OBSIDIAN_MAX_ATTACHMENT_BYTES:-10485760}
    ports:
      - "127.0.0.1:${MCP_PORT:-7002}:7002"
    depends_on:
      - obsidian-api
    networks:
      - obsidian-net

networks:
  obsidian-net:
    driver: bridge
