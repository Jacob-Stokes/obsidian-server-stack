name: ${INSTANCE_PREFIX:-}obsidian-server-stack

# Every vault's services (its sync, and the Obsidian app if enabled), CouchDB
# and the manager add-on, written by obsidian-stack, so `docker compose ps`,
# `up` and `down` here cover the whole install.
include:
  - vaults.compose.yml

services:
  # REST API over the vaults' markdown files. Only reachable inside this
  # compose network — obsidian-mcp is its only client. Each request names a
  # vault; the list of vaults is vaults/.registry.json, managed by obsidian-stack
  # (or VAULTS, for a deployment written by hand: docs/compose.md).
  obsidian-api:
    build:
      context: ./services/obsidian-api
    image: ${INSTANCE_PREFIX:-}obsidian-api:local
    container_name: ${INSTANCE_PREFIX:-}obsidian-api
    labels:
      obsidian-server-stack.id: ${STACK_ID:?Set STACK_ID in .env}
      obsidian-server-stack.role: core
    restart: unless-stopped
    environment:
      PORT: 3000
      VAULTS_ROOT: /vaults
      API_KEY: ${API_KEY:?Set API_KEY in .env}
    volumes:
      - ./vaults:/vaults
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - obsidian-net

  # The MCP server. MCP clients authenticate to it with MCP_BEARER_TOKEN; it
  # authenticates to obsidian-api with API_KEY.
  obsidian-mcp:
    build:
      context: ./services/obsidian-mcp
    image: ${INSTANCE_PREFIX:-}obsidian-mcp:local
    container_name: ${INSTANCE_PREFIX:-}obsidian-mcp
    labels:
      obsidian-server-stack.id: ${STACK_ID:?Set STACK_ID in .env}
      obsidian-server-stack.role: core
    restart: unless-stopped
    environment:
      PORT: 7002
      OBSIDIAN_BASE_URL: http://obsidian-api:3000
      OBSIDIAN_API_KEY: ${API_KEY:?Set API_KEY in .env}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?Set MCP_BEARER_TOKEN in .env}
      OBSIDIAN_DAILY_FOLDER: ${OBSIDIAN_DAILY_FOLDER:-Journal}
      OBSIDIAN_TIMEZONE: ${OBSIDIAN_TIMEZONE:-UTC}
      OBSIDIAN_MAX_ATTACHMENT_BYTES: ${OBSIDIAN_MAX_ATTACHMENT_BYTES:-10485760}
      # For the optional Obsidian app add-on: its containers are named
      # <prefix>obsidian-<vault id>-app, and share this token.
      OBSIDIAN_APP_HOST_PREFIX: ${INSTANCE_PREFIX:-}
      OBSIDIAN_APP_TOKEN: ${OBSIDIAN_APP_TOKEN:-}
      # For the optional manager add-on (extras/manager); its tools are only
      # offered when OBSIDIAN_MANAGER_TOKEN is set.
      OBSIDIAN_MANAGER_URL: http://${INSTANCE_PREFIX:-}obsidian-manager:7320
      OBSIDIAN_MANAGER_TOKEN: ${OBSIDIAN_MANAGER_TOKEN:-}
      # Optional OAuth for clients that need a login (docs/mcp.md): on when
      # MCP_OAUTH_ISSUER and MCP_OAUTH_CANONICAL_URL are set.
      MCP_OAUTH_ISSUER: ${MCP_OAUTH_ISSUER:-}
      MCP_OAUTH_CANONICAL_URL: ${MCP_OAUTH_CANONICAL_URL:-}
      MCP_OAUTH_JWKS_URI: ${MCP_OAUTH_JWKS_URI:-}
      MCP_OAUTH_AUDIENCE: ${MCP_OAUTH_AUDIENCE:-}
      MCP_OAUTH_SCOPES: ${MCP_OAUTH_SCOPES:-}
    ports:
      - "127.0.0.1:${MCP_PORT:-7002}:7002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:7002/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      obsidian-api:
        condition: service_healthy
    networks:
      - obsidian-net

networks:
  obsidian-net:
    # Fixed name, so the optional Obsidian app add-on (extras/obsidian-app)
    # can join it and obsidian-mcp can reach it.
    name: ${INSTANCE_PREFIX:-}obsidian-internal
    driver: bridge
