# Optional add-on: lets obsidian-mcp manage this install (add, rename and
# remove vaults, restart sync, turn the Obsidian app on or off, make Setup
# URIs) through a fixed list of operations. Off by default; started by
# `obsidian-stack manager enable`. See README.md here and
# docs/decisions/001-mcp-stack-management.md.
#
# It holds the Docker socket, which is root-equivalent on this machine:
# that's why it's opt-in, has its own token, and only runs `obsidian-stack`
# with arguments it has checked, never arbitrary Docker commands.
#
#   STACK_DIR=<install folder> docker compose -p <prefix>obsidian-manager \
#     --project-directory extras/manager -f extras/manager/docker-compose.yml --env-file .env up -d --build

services:
  manager:
    build:
      context: .
    image: ${INSTANCE_PREFIX:-}obsidian-manager:local
    container_name: ${INSTANCE_PREFIX:-}obsidian-manager
    labels:
      obsidian-server-stack.id: ${STACK_ID:?Set STACK_ID in .env}
      obsidian-server-stack.role: manager
    restart: unless-stopped
    environment:
      MANAGER_TOKEN: ${OBSIDIAN_MANAGER_TOKEN:?}
      STACK_DIR: ${STACK_DIR:?}
      # obsidian-stack checks the MCP at localhost; from here it's by name
      OBSIDIAN_MCP_HEALTH_URL: http://${INSTANCE_PREFIX:-}obsidian-mcp:7002/health
    volumes:
      # At the same path as on the host: obsidian-stack creates bind mounts
      # by path, and those paths are the host's.
      - ${STACK_DIR:?}:${STACK_DIR:?}
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal

networks:
  internal:
    name: ${INSTANCE_PREFIX:-}obsidian-internal
    external: true
